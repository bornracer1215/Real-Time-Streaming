name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    # Fast, no Docker/Kafka/Postgres/Redis needed: pyspark runs natively here since GitHub's
    # runners are Linux (the Windows winutils.exe problem documented in decisions.md doesn't
    # apply on this OS), and the dashboard tests use fakeredis instead of a real Redis server.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r producer/requirements.txt
          pip install -r spark_streaming/requirements.txt
          pip install -r dashboard/requirements.txt
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest tests/ -v

  integration-smoke-test:
    # Slower, real end-to-end check: brings up the actual Docker Compose stack, runs the actual
    # producer and the actual Spark job (in its container, exactly as documented in the README),
    # and asserts real data landed in both Postgres and Redis. This is the test that answers
    # "does the whole pipeline actually work," not just "is each piece's logic correct."
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Start infrastructure
        run: docker compose up -d

      - name: Wait for services to be healthy
        run: |
          timeout 120 bash -c '
            until [ "$(docker inspect -f "{{.State.Health.Status}}" kafka)" = "healthy" ] \
              && [ "$(docker inspect -f "{{.State.Health.Status}}" postgres)" = "healthy" ] \
              && [ "$(docker inspect -f "{{.State.Health.Status}}" redis)" = "healthy" ]; do
              echo "waiting for services..."
              sleep 3
            done
          '

      - name: Create Kafka topic
        run: |
          docker exec kafka /opt/kafka/bin/kafka-topics.sh --create \
            --topic iot-sensor-readings --bootstrap-server localhost:9092 \
            --partitions 3 --replication-factor 1

      - name: Install Spark container's Python dependencies
        run: docker exec spark pip3 install --target=/app/.python-packages psycopg2-binary redis

      - name: Start the Spark streaming job (detached, short demo windows for a fast test)
        run: |
          docker exec -d -e PYTHONPATH=/app/.python-packages spark /opt/spark/bin/spark-submit \
            --master local[*] --conf spark.jars.ivy=/app/.ivy2 \
            --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1 \
            stream_processor.py --starting-offsets earliest --trigger-interval "5 seconds" \
            --window-duration "20 seconds" --slide-duration "10 seconds" --watermark "5 seconds"

      - name: Wait for the Spark job to initialize (package resolution + SparkSession startup)
        run: sleep 60

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate test traffic with the producer
        run: |
          pip install -r producer/requirements.txt
          python producer/producer.py --rate 50 --duration 30

      - name: Wait for at least one window to be processed and written
        run: sleep 20

      - name: Verify windowed aggregates landed in Postgres
        run: |
          count=$(docker exec postgres psql -U streaming -d streaming -t -c \
            "SELECT count(*) FROM sensor_window_aggregates;" | tr -d '[:space:]')
          echo "Postgres rows: $count"
          test "$count" -gt 0

      - name: Verify latest snapshots landed in Redis
        run: |
          keys=$(docker exec redis redis-cli --scan --pattern "latest:*" | wc -l)
          echo "Redis keys: $keys"
          test "$keys" -gt 0

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v
